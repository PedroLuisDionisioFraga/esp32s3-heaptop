name: Host Tests

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  unity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The pure modules (calc, render, stream, json) need only a C compiler and Unity.
      - name: Fetch Unity
        run: git clone --depth 1 --branch v2.6.0 https://github.com/ThrowTheSwitch/Unity.git unity

      - name: Run host tests
        run: UNITY_DIR="$PWD/unity/src" bash test/host/run_tests.sh
